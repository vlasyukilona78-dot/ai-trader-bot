spec_version: mexc_strategy_v2

# These are the inputs used by the current signals-only MEXC scanner.  Windows
# remain counts of their source bars; changing an interval does not preserve a
# fixed wall-clock duration automatically.
market_data:
  base_interval: Min60
  base_candles: 320
  benchmark_interval: same_as_base
  higher_timeframe:
    interval: Hour4
    candles: 120
    ttl_sec: 1800.0
    max_symbols: 500

runtime_semantics:
  logic_revision: layered_pump_signal_v1
  window_semantics: fixed_bar_counts
  layered_min_history_bars: 80
  signal_generator_min_history_bars: 40

signal:
  rsi_high: 75.0
  rsi_low: 25.0
  volume_spike_threshold: 2.5
  weakness_lookback: 4
  sentiment_bullish_threshold: 68.0
  sentiment_bearish_threshold: 32.0
  risk_reward: 1.6
  atr_sl_mult: 1.0
  entry_tolerance_pct: 0.0015
  vwap_tolerance_pct: 0.0025
  funding_tolerance: 0.0003
  long_short_ratio_tolerance: 0.1
  msb_lookback: 20
  msb_recent_bars: 6
  msb_break_buffer_pct: 0.0005
  confirmation_enabled: true
  confirmation_max_wait_bars: 3
  confirmation_invalidate_pct: 0.0015
  pump_window_enabled: true
  pump_window_bars: 45
  pump_min_move_pct: 0.03
  pump_min_bars_since_peak: 1
  pump_max_retrace_pct: 0.5
  pump_entry_max_dist_from_peak_pct: 0.015
  pump_stop_buffer_pct: 0.003
  stop_buffer_atr_mult: 0.5
  structural_anchor_htf: true
  structural_anchor_htf_bars: 12
  max_stop_distance_pct: 0.03
  min_risk_reward: 1.5
  report_leverage: 100.0
  min_atr_pct: 0.046
  min_hourly_usd_volume: 100000.0
  liquidity_lookback_bars: 12
  min_relative_strength: 0.05
  relative_strength_lookback: 24
  require_benchmark: true
  require_level_overhead: false
  min_level_dist_pct: 0.018
  weakness_layer_enabled: false
  min_rsi_4h: 61.6
  require_htf: true
  min_rsi_1h: 0.0
  require_confluence: 0
  max_chase_atr: 0.0
  enable_long_side: false

volatility:
  percentile: 0.8
  max_age_sec: 900.0
  min_observations: 20
  fallback_floor: 0.046

# The periods and multipliers below are executable compute_indicators inputs.
# Mode literals name fixed, non-switchable cumulative semantics; their numerical
# behavior is pinned by tests/v2/test_indicator_golden_vectors_v2.py.
indicators:
  revision: core_indicators_v1
  rsi_period_bars: 14
  ema_fast_span_bars: 20
  ema_slow_span_bars: 50
  atr_period_bars: 14
  bollinger_period_bars: 20
  bollinger_stddev_multiplier: 2.0
  keltner_period_bars: 20
  keltner_atr_multiplier: 1.5
  volume_ma_period_bars: 20
  adx_period_bars: 14
  vwap_mode: cumulative_input_frame
  obv_mode: cumulative_input_frame
  cvd_mode: candle_direction_cumulative_input_frame

volume_profile:
  revision: core_volume_profile_v1
  window_bars: 120
  bins: 48
  value_area: 0.7
  minimum_history_bars: 20
  minimum_sample_bars: 24
